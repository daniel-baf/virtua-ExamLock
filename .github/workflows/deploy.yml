name: Deploy ExamLock

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "agent/**"
      - "container/**"
      - "dashboard/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      force_infra:
        description: "Forzar terraform apply aunque no cambió infra/"
        type: boolean
        default: false
      force_dashboard:
        description: "Forzar deploy del dashboard"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # necesario para Workload Identity Federation

env:
  PROJECT_ID: copper-axiom-496204-b2
  REGION: us-central1
  REPO: examlock
  SERVER_IMAGE_NAME: server
  AGENT_IMAGE_NAME: agent
  FIREBASE_PROJECT: copper-axiom-496204-b2

jobs:
  # ── Detecta qué cambió ────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server:    ${{ steps.filter.outputs.server }}
      agent:     ${{ steps.filter.outputs.agent }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      infra:     ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            agent:
              - 'agent/**'
              - 'container/**'
            dashboard:
              - 'dashboard/**'
            infra:
              - 'infra/**'

  # ── Auth GCP (Workload Identity) ──────────────────────────────────────────
  # Job reutilizable — outputs el token para los demás jobs

  # ── Build + Push: imagen del servidor ────────────────────────────────────
  build-server:
    name: Build & push server image
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event.inputs.force_infra == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push server
        id: meta
        env:
          IMAGE_BASE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVER_IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          docker build -f server/Dockerfile -t "$IMAGE_BASE:$SHA" -t "$IMAGE_BASE:latest" .
          docker push "$IMAGE_BASE:$SHA"
          docker push "$IMAGE_BASE:latest"
          echo "image=$IMAGE_BASE:$SHA" >> "$GITHUB_OUTPUT"

  # ── Build + Push: imagen del agente ───────────────────────────────────────
  build-agent:
    name: Build & push agent image
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.event.inputs.force_infra == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push agent
        id: meta
        env:
          IMAGE_BASE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.AGENT_IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          docker build -f container/Dockerfile -t "$IMAGE_BASE:$SHA" -t "$IMAGE_BASE:latest" .
          docker push "$IMAGE_BASE:$SHA"
          docker push "$IMAGE_BASE:latest"
          echo "image=$IMAGE_BASE:$SHA" >> "$GITHUB_OUTPUT"

  # ── Terraform: infraestructura GCP ────────────────────────────────────────
  terraform:
    name: Terraform apply
    needs: [changes, build-server]
    # Corre si cambió infra/, o si el server fue rebuildeado (nueva imagen)
    if: |
      always() &&
      (needs.changes.outputs.infra == 'true' ||
       needs.build-server.result == 'success' ||
       github.event.inputs.force_infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      # Determina la imagen a desplegar:
      # si build-server corrió → usa su output; sino → mantiene la actual (ignore_changes)
      - name: Resolve server image
        id: image
        run: |
          if [ -n "${{ needs.build-server.outputs.image }}" ]; then
            echo "server_image=${{ needs.build-server.outputs.image }}" >> "$GITHUB_OUTPUT"
          else
            # Lee la imagen actual del Cloud Run sin cambiarla
            CURRENT=$(gcloud run services describe exam-server \
              --region=${{ env.REGION }} \
              --format="value(spec.template.spec.containers[0].image)" 2>/dev/null \
              || echo "us-docker.pkg.dev/cloudrun/container/hello")
            echo "server_image=$CURRENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform plan
        run: |
          terraform plan \
            -var="server_image=${{ steps.image.outputs.server_image }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -out=tfplan \
            -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: Output server URL
        run: terraform output -raw server_url

  # ── Deploy Cloud Run: actualiza imagen si terraform no lo hizo ───────────
  deploy-server:
    name: Deploy server to Cloud Run
    needs: [changes, build-server, terraform]
    if: |
      always() &&
      needs.build-server.result == 'success' &&
      needs.terraform.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Update Cloud Run image
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: exam-server
          region: ${{ env.REGION }}
          image: ${{ needs.build-server.outputs.image }}

  # ── Deploy dashboard a Firebase Hosting ──────────────────────────────────
  deploy-dashboard:
    name: Deploy dashboard to Firebase Hosting
    needs: [changes, terraform]
    if: |
      always() &&
      (needs.changes.outputs.dashboard == 'true' ||
       github.event.inputs.force_dashboard == 'true') &&
      needs.terraform.result != 'failure'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Get server URL
        id: server
        run: |
          URL=$(gcloud run services describe exam-server \
            --region=${{ env.REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        copper-axiom-496204-b2.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID:         copper-axiom-496204-b2
          VITE_FIREBASE_STORAGE_BUCKET:     copper-axiom-496204-b2.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SERVER_URL:                  ${{ steps.server.outputs.url }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        # ADC configurado por google-github-actions/auth.
        # .firebaserc apunta al proyecto — mismo proyecto que GCP, mismas credenciales.
        run: firebase deploy --only hosting --non-interactive

  # ── Notificación de resultado ─────────────────────────────────────────────
  notify:
    name: Summary
    needs: [build-server, build-agent, terraform, deploy-server, deploy-dashboard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print deploy summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| build-server    | ${{ needs.build-server.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-agent     | ${{ needs.build-agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| terraform       | ${{ needs.terraform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| deploy-server   | ${{ needs.deploy-server.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| deploy-dashboard| ${{ needs.deploy-dashboard.result }} |" >> $GITHUB_STEP_SUMMARY
