name: Deploy Presentation to GitHub Pages

on:
  push:
    branches: [deploy, develop]
    paths:
      - "docs/presentation-react/**"
      - ".github/workflows/pages-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-presentation"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/presentation-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs/presentation-react

      - name: Build presentation
        run: npm run build
        working-directory: docs/presentation-react

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/presentation-built

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
