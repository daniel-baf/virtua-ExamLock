<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamLock — Examen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0a0a0f;
    color: #e5e7eb;
    min-height: 100vh;
    padding-bottom: 4rem;
    user-select: none;
  }
  header {
    background: #111118;
    border-bottom: 1px solid #1f2030;
    padding: .75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .logo-row { display: flex; align-items: center; gap: .5rem; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  .dot.offline { background: #f59e0b; }
  #timer { font-variant-numeric: tabular-nums; color: #9ca3af; font-size: .9rem; }
  #timer.warn { color: #f59e0b; }
  #timer.danger { color: #ef4444; font-weight: 700; }
  main { max-width: 760px; margin: 0 auto; padding: 2rem 1rem; }
  .question {
    background: #111118;
    border: 1px solid #1f2030;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .q-num { font-size: .75rem; color: #6b7280; margin-bottom: .5rem; }
  .q-text { font-size: 1rem; line-height: 1.6; margin-bottom: 1rem; }
  .option {
    display: flex; align-items: center; gap: .75rem;
    padding: .65rem .75rem;
    border: 1px solid #2d2d3d;
    border-radius: 8px;
    margin-bottom: .5rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .option:hover { background: #1a1a24; }
  .option.selected { border-color: #7c3aed; background: #1a0a2e; }
  .option input { accent-color: #7c3aed; }
  textarea {
    width: 100%;
    background: #1a1a24;
    border: 1px solid #2d2d3d;
    border-radius: 8px;
    padding: .65rem .75rem;
    color: #e5e7eb;
    font-size: .9rem;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
  }
  textarea:focus { border-color: #7c3aed; }
  .saved-badge {
    font-size: .75rem; color: #22c55e;
    opacity: 0; transition: opacity .3s;
    margin-left: .5rem;
  }
  .saved-badge.show { opacity: 1; }

  /* Overlay for messages/blocks */
  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 100;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 1rem;
    text-align: center; padding: 2rem;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 1.5rem; }
  #overlay p { color: #9ca3af; max-width: 380px; }
  #overlay button {
    background: #7c3aed; color: #fff; border: none;
    border-radius: 8px; padding: .65rem 1.5rem;
    font-size: .9rem; cursor: pointer;
  }
  #overlay button:hover { background: #6d28d9; }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="dot" id="dot"></div>
    <span>ExamLock</span>
  </div>
  <div id="timer">--:--</div>
</header>

<main id="main">
  <p style="color:#6b7280;text-align:center;padding:3rem 0">Cargando preguntas…</p>
</main>

<!-- Overlay -->
<div id="overlay">
  <div id="overlay-icon" style="font-size:3rem"></div>
  <h2 id="overlay-title"></h2>
  <p id="overlay-msg"></p>
  <button id="overlay-btn" style="display:none" onclick="hideOverlay()">Entendido</button>
</div>

<script>
const answers = {};
let endsAt = null;
let timerInterval = null;

// ── SSE (server events) ──────────────────────────────────────────────────────
const evts = new EventSource('/api/events');
evts.addEventListener('block-internet', () => showOverlay('🔒', 'Internet bloqueado',
  'El docente ha bloqueado tu acceso a internet temporalmente.', false));
evts.addEventListener('unblock-internet', hideOverlay);
evts.addEventListener('message', e => {
  const { text } = JSON.parse(e.data);
  showOverlay('✉️', 'Mensaje del docente', text, true);
});
evts.addEventListener('exam-ended', () => {
  window.location.href = '/ended';
});
evts.addEventListener('reactivate', hideOverlay);

// ── Load questions ───────────────────────────────────────────────────────────
async function loadQuestions() {
  try {
    const res = await fetch('/api/questions');
    const data = await res.json();
    render(data.questions ?? []);
  } catch {
    document.getElementById('main').innerHTML =
      '<p style="color:#ef4444;text-align:center;padding:3rem 0">Error al cargar preguntas.</p>';
  }
}

function render(questions) {
  const main = document.getElementById('main');
  if (questions.length === 0) {
    main.innerHTML = '<p style="color:#6b7280;text-align:center;padding:3rem 0">Sin preguntas.</p>';
    return;
  }
  main.innerHTML = questions.map((q, i) => buildQuestion(q, i)).join('');
}

function buildQuestion(q, i) {
  let controls = '';
  if (q.type === 'multiple_choice') {
    controls = (q.options ?? []).map((opt, j) => `
      <label class="option" id="opt-${q.id}-${j}" onclick="selectOption('${q.id}', '${q.id}-${j}', this, '${escHtml(opt)}')">
        <input type="radio" name="q-${q.id}" value="${escHtml(opt)}"> ${escHtml(opt)}
      </label>`).join('');
  } else if (q.type === 'true_false') {
    controls = ['Verdadero', 'Falso'].map((v, j) => `
      <label class="option" id="opt-${q.id}-${j}" onclick="selectOption('${q.id}', '${q.id}-${j}', this, '${v}')">
        <input type="radio" name="q-${q.id}" value="${v}"> ${v}
      </label>`).join('');
  } else {
    controls = `<textarea rows="4" placeholder="Escribe tu respuesta…"
      oninput="debounceSave('${q.id}', this.value)" id="ta-${q.id}"></textarea>`;
  }

  return `
    <div class="question">
      <div class="q-num">Pregunta ${i + 1}</div>
      <div class="q-text">${escHtml(q.text)}</div>
      ${controls}
      <span class="saved-badge" id="badge-${q.id}">✓ guardado</span>
    </div>`;
}

function selectOption(questionId, optId, el, value) {
  // Deselect siblings
  document.querySelectorAll(`[id^="opt-${questionId}-"]`).forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  el.querySelector('input').checked = true;
  saveAnswer(questionId, value);
}

const debounceTimers = {};
function debounceSave(questionId, value) {
  clearTimeout(debounceTimers[questionId]);
  debounceTimers[questionId] = setTimeout(() => saveAnswer(questionId, value), 600);
}

async function saveAnswer(questionId, answer) {
  answers[questionId] = answer;
  try {
    await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questionId, answer }),
    });
    flashBadge(questionId);
  } catch { /* queued locally in agent */ }
}

function flashBadge(questionId) {
  const badge = document.getElementById(`badge-${questionId}`);
  if (!badge) return;
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 2000);
}

// ── Timer ────────────────────────────────────────────────────────────────────
function startTimer(endTs) {
  endsAt = endTs;
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, endsAt - Date.now());
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    const el = document.getElementById('timer');
    el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    el.className = remaining < 60000 ? 'danger' : remaining < 300000 ? 'warn' : '';
    if (remaining === 0) {
      clearInterval(timerInterval);
      window.location.href = '/ended';
    }
  }, 1000);
}

// ── Overlay ──────────────────────────────────────────────────────────────────
function showOverlay(icon, title, msg, dismissible) {
  document.getElementById('overlay-icon').textContent = icon;
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('overlay-btn').style.display = dismissible ? 'block' : 'none';
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

// ── Connection indicator ─────────────────────────────────────────────────────
evts.addEventListener('connected', () => {
  document.getElementById('dot').classList.remove('offline');
});
evts.onerror = () => {
  document.getElementById('dot').classList.add('offline');
};

// ── Init ─────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

fetch('/api/state').then(r => r.json()).then(d => {
  if (d.endsAt) startTimer(d.endsAt);
  if (d.status === 'ended') window.location.href = '/ended';
});

loadQuestions();
</script>
</body>
</html>
